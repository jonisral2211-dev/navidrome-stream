name: Build iOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS (release, sin firma)
    runs-on: macos-latest
    timeout-minutes: 60

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Mostrar versión de Flutter
        run: flutter --version

      - name: Dependencias
        run: flutter pub get

      - name: Análisis estático
        run: flutter analyze

      - name: Tests
        run: flutter test

      - name: Compilar iOS release sin firma
        run: flutter build ios --release --no-codesign

      - name: Empaquetar Runner.app como .ipa sin firmar
        working-directory: app/build/ios/iphoneos
        run: |
          mkdir Payload
          cp -R Runner.app Payload/
          zip -qr navidrome_stream-unsigned.ipa Payload
          rm -rf Payload

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: navidrome_stream-ios-release-unsigned
          path: |
            app/build/ios/iphoneos/navidrome_stream-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
